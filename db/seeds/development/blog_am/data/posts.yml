- slug: secrets-of-putins-psychology
  title:
    en: "<span>Secrets</span><br>of Putin's Psychology"
    ua: "<span>Секрети</span><br>психології Путіна"
    ru: "<span>Секреты</span><br>психологии Путина"
    pl: "<span>Sekrety</span><br>psychologii Putina"
  subtitle:
    en: "Putin delivers an ultimatum to Zelensky"
    ua: "Путін ставить ультиматум Зеленському"
    ru: "Путин ставит ультиматум Зеленскому"
    pl: "Putin stawia ultimatum Zełenskiemu"
  lead:
    en: "Today at the press conference of the president, a representative of the TV channelization called \"NASH\" publicly broadcast to Vladimir Zelensky the lie that Lenur Islyamov is allegedly a citizen of Russia."
    ua: "Сьогодні на прес-конференції президента представник телеканалізації під назвою \"НАШ\" публічно транслював Володимиру Зеленському неправду про те, що нібито Ленур Іслямов – громадянин Росії."
    ru: "Поэтому сегодня на пресс-конференции президента представитель телеканализации под названием \"НАШ\" публично протранслировал Владимиру Зеленскому ложь о том, что якобы Ленур Ислямов – гражданин России."
    pl: "Dlatego dziś na konferencji prasowej prezydenta przedstawiciel telekanalizacji o nazwie \"NASZ\" publicznie przekazał Władimirowi Zełenskiemu kłamstwo, że Lenur Isłamow jest rzekomo obywatelem Rosji."
  content:
    en: |
      <div class="section-article-item__paragraph site-text__bold-24">Today in Kyiv, another press conference of the President of Ukraine Volodymyr Zelensky was held. I will not analyze its content in detail, since no journalist asked the president the main question about the confrontation with Russia. And this question should have concerned Putin's direct ultimatum, read out yesterday from the cheat sheet sent from Moscow by the so-called "head of the LPR" in his "emergency video address".</div>
      <div class="section-article-item__paragraph site-text__large-24">What is it about? About the fact that, allegedly, the Ukrainian troops are destroying the civilian infrastructure of the "LPR". First, the mouth of the "head of the DPR" reads this lie, and then "sets the condition" for the President of Ukraine, which can be briefly expressed as follows:</div>
      <div class="section-article-item__paragraph site-text__large-24">"If you continue not to \"strive for peace\" on Putin's terms, then Russian troops will go on the offensive on those sections of the front where the Russian General Staff deems necessary, and \"push\" the line of contact deeper into Ukraine"</div>
      <div class="section-article-item__paragraph site-text__bold-24 text-quote">Let us not evaluate the military realism of this "blitzkrieg", let us discuss what is behind its threat.<span class="text-quote-quotes"><svg width="40" height="36" viewBox="0 0 40 36" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M36.25 0.5H26.25C24.1797 0.5 22.5 2.17969 22.5 4.25V14.25C22.5 16.3203 24.1797 18 26.25 18H32.5V23C32.5 25.7578 30.2578 28 27.5 28H26.875C25.8359 28 25 28.8359 25 29.875V33.625C25 34.6641 25.8359 35.5 26.875 35.5H27.5C34.4062 35.5 40 29.9062 40 23V4.25C40 2.17969 38.3203 0.5 36.25 0.5ZM13.75 0.5H3.75C1.67969 0.5 0 2.17969 0 4.25V14.25C0 16.3203 1.67969 18 3.75 18H10V23C10 25.7578 7.75781 28 5 28H4.375C3.33594 28 2.5 28.8359 2.5 29.875V33.625C2.5 34.6641 3.33594 35.5 4.375 35.5H5C11.9062 35.5 17.5 29.9062 17.5 23V4.25C17.5 2.17969 15.8203 0.5 13.75 0.5Z" fill="black"/></svg></span></div>
      <div class="section-article-item__paragraph site-text__large-24">Putin threatens to multiply by zero all agreements on the separation of forces and other "peaceful" nonsense, which means nothing to the Russians. The goal is to force our country's authorities to accept the so-called "Minsk-3" on the terms dictated by Russia.</div>
    ua: |
      <div class="section-article-item__paragraph site-text__bold-24">Сьогодні в Києві відбулася чергова прес-конференція президента України Володимира Зеленського. Я не буду детально аналізувати її зміст, оскільки головного питання про протистояння з Росією ніхто з журналістів президенту так і не поставив. А стосуватися це питання мало прямого ультиматуму Путіна, зачитаного вчора з надісланої з Москви шпаргалки т.зв. "главою ЛНР" у його "екстреному відеозверненні".</div>
      <div class="section-article-item__paragraph site-text__large-24">Про що там ідеться? Про те, що, нібито, українські війська руйнують цивільну інфраструктуру "ЛНР". Спочатку рот "глави ДНР" зачитує цю брехню, а потім "ставить умову" президенту України, яку стисло можна виразити так:</div>
      <div class="section-article-item__paragraph site-text__large-24">"Якщо ви й далі не будете "прагнути до миру" на умовах Путіна, то російські війська підуть у наступ на тих ділянках фронту, де Генштаб РФ вважатиме за потрібне, і "відсуне" вглиб України лінію зіткнення"</div>
      <div class="section-article-item__paragraph site-text__bold-24 text-quote">Не будемо оцінювати військову реалістичність цього "бліцкригу", обговоримо те, що за його загрозою стоїть.<span class="text-quote-quotes"><svg width="40" height="36" viewBox="0 0 40 36" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M36.25 0.5H26.25C24.1797 0.5 22.5 2.17969 22.5 4.25V14.25C22.5 16.3203 24.1797 18 26.25 18H32.5V23C32.5 25.7578 30.2578 28 27.5 28H26.875C25.8359 28 25 28.8359 25 29.875V33.625C25 34.6641 25.8359 35.5 26.875 35.5H27.5C34.4062 35.5 40 29.9062 40 23V4.25C40 2.17969 38.3203 0.5 36.25 0.5ZM13.75 0.5H3.75C1.67969 0.5 0 2.17969 0 4.25V14.25C0 16.3203 1.67969 18 3.75 18H10V23C10 25.7578 7.75781 28 5 28H4.375C3.33594 28 2.5 28.8359 2.5 29.875V33.625C2.5 34.6641 3.33594 35.5 4.375 35.5H5C11.9062 35.5 17.5 29.9062 17.5 23V4.25C17.5 2.17969 15.8203 0.5 13.75 0.5Z" fill="black"/></svg></span></div>
      <div class="section-article-item__paragraph site-text__large-24">Путін погрожує помножити на нуль усі домовленості про розведення сил та іншу "мирну" нісенітницю, яка для росіян нічого не варта. Мета – примусити владу нашої країни прийняти т.зв. "Мінськ-3" на продиктованих Росією умовах.</div>
    ru: |
      <div class="section-article-item__paragraph site-text__bold-24">Сегодня в Киеве прошла очередная пресс-конференция президента Украины Владимира Зеленского. Я не буду подробно анализировать ее содержание, поскольку главного вопроса о противостоянии с Россией никто из журналистов президенту так и не задал. А касаться этот вопрос должен был прямого ультиматума Путина, зачитанного вчера с присланной из Москвы шпаргалки т.н. "главой ЛНР" в его "экстренном видеообращении".</div>
      <div class="section-article-item__paragraph site-text__large-24">О чем там идет речь? О том, что, якобы, украинские войска разрушают гражданскую инфраструктуру "ЛНР". Сначала рот "главы ДНР" зачитывает эту брехню, а затем "ставит условие" президенту Украины, которое сжато можно выразить так:</div>
      <div class="section-article-item__paragraph site-text__large-24">"Если вы и дальше не будете "стремиться к миру" на условиях Путина, то российские войска пойдут в наступление на тех участках фронта, где Генштаб РФ посчитает нужным, и "отодвинет" вглубь Украины линию соприкосновения"</div>
      <div class="section-article-item__paragraph site-text__bold-24 text-quote">Не будем оценивать военную реалистичность этого "блицкрига", обсудим то, что за его угрозой стоит.<span class="text-quote-quotes"><svg width="40" height="36" viewBox="0 0 40 36" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M36.25 0.5H26.25C24.1797 0.5 22.5 2.17969 22.5 4.25V14.25C22.5 16.3203 24.1797 18 26.25 18H32.5V23C32.5 25.7578 30.2578 28 27.5 28H26.875C25.8359 28 25 28.8359 25 29.875V33.625C25 34.6641 25.8359 35.5 26.875 35.5H27.5C34.4062 35.5 40 29.9062 40 23V4.25C40 2.17969 38.3203 0.5 36.25 0.5ZM13.75 0.5H3.75C1.67969 0.5 0 2.17969 0 4.25V14.25C0 16.3203 1.67969 18 3.75 18H10V23C10 25.7578 7.75781 28 5 28H4.375C3.33594 28 2.5 28.8359 2.5 29.875V33.625C2.5 34.6641 3.33594 35.5 4.375 35.5H5C11.9062 35.5 17.5 29.9062 17.5 23V4.25C17.5 2.17969 15.8203 0.5 13.75 0.5Z" fill="black"/></svg></span></div>
      <div class="section-article-item__paragraph site-text__large-24">Путин грозит помножить на ноль все договоренности о разведении сил и прочую "мирную" лабуду, которая для русских ничего не стоит. Цель – принудить власти нашей страны принять т.н. "Минск-3" на продиктованных Россией условиях.</div>
    pl: |
      <div class="section-article-item__paragraph site-text__bold-24">Dziś w Kijowie odbyła się kolejna konferencja prasowa prezydenta Ukrainy Wołodymyra Zełenskiego. Nie będę szczegółowo analizować jej treści, ponieważ żaden z dziennikarzy nie zadał prezydentowi głównego pytania o konfrontację z Rosją. A pytanie to powinno dotyczyć bezpośredniego ultimatum Putina, odczytanego wczoraj ze ściągi przesłanej z Moskwy przez tzw. "głowę ŁRL" w jego "nadzwyczajnym orędziu wideo".</div>
      <div class="section-article-item__paragraph site-text__large-24">O co tam chodzi? O to, że rzekomo ukraińskie wojska niszczą infrastrukturę cywilną "ŁRL". Najpierw "głowa DRL" odczytuje te kłamstwa, a następnie "stawia warunek" prezydentowi Ukrainy, który można krótko wyrazić następująco:</div>
      <div class="section-article-item__paragraph site-text__large-24">"Jeśli nadal nie będziecie \"dążyć do pokoju\" na warunkach Putina, to rosyjskie wojska przejdą do ofensywy na tych odcinkach frontu, gdzie Sztab Generalny FR uzna za stosowne, i \"przesuną\" linię kontaktową w głąb Ukrainy"</div>
      <div class="section-article-item__paragraph site-text__bold-24 text-quote">Nie będziemy oceniać militarnego realizmu tego "blitzkriegu", omówmy to, co kryje się za jego groźbą.<span class="text-quote-quotes"><svg width="40" height="36" viewBox="0 0 40 36" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M36.25 0.5H26.25C24.1797 0.5 22.5 2.17969 22.5 4.25V14.25C22.5 16.3203 24.1797 18 26.25 18H32.5V23C32.5 25.7578 30.2578 28 27.5 28H26.875C25.8359 28 25 28.8359 25 29.875V33.625C25 34.6641 25.8359 35.5 26.875 35.5H27.5C34.4062 35.5 40 29.9062 40 23V4.25C40 2.17969 38.3203 0.5 36.25 0.5ZM13.75 0.5H3.75C1.67969 0.5 0 2.17969 0 4.25V14.25C0 16.3203 1.67969 18 3.75 18H10V23C10 25.7578 7.75781 28 5 28H4.375C3.33594 28 2.5 28.8359 2.5 29.875V33.625C2.5 34.6641 3.33594 35.5 4.375 35.5H5C11.9062 35.5 17.5 29.9062 17.5 23V4.25C17.5 2.17969 15.8203 0.5 13.75 0.5Z" fill="black"/></svg></span></div>
      <div class="section-article-item__paragraph site-text__large-24">Putin grozi zrównaniem z ziemią wszystkich porozumień o rozdzieleniu sił i innych "pokojowych" bzdur, które dla Rosjan nic nie znaczą. Celem jest zmuszenie władz naszego kraju do przyjęcia tzw. "Mińska-3" na warunkach dyktowanych przez Rosję.</div>
