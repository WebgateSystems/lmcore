# 7. Крымские татары по 3 рубля 95 копеек (23 октября 2015)
- slug: krymskie-tatary-po-3-rublya-95-kopeek
  title:
    ru: "Крымские татары по 3 рубля 95 копеек"
    ua: "Кримські татари по 3 рублі 95 копійок"
    en: "Crimean Tatars for 3 rubles 95 kopecks"
    pl: "Tatarzy krymscy za 3 ruble 95 kopiejek"
  subtitle:
    ru: "Спасибо Демчишину — не знаю, как насчёт порядочности, но, безусловно, — честному человеку."
    ua: "Дякую Демчишину — не знаю, як щодо порядності, але, безумовно, — чесній людині."
    en: "Thanks to Demchyshyn — I don't know about decency, but certainly — an honest man."
    pl: "Dziękuję Demczyszynowi — nie wiem jak z przyzwoitością, ale z pewnością — uczciwemu człowiekowi."
  lead:
    ru: "Благодаря его искренности всем стало ясно, почем нынче в Украине жизни крымских татар."
    ua: "Завдяки його щирості всім стало ясно, почому нині в Україні життя кримських татар."
    en: "Thanks to his sincerity, everyone now understands the price of the lives of Crimean Tatars."
    pl: "Dzięki jego szczerości wszyscy teraz rozumieją, ile kosztuje życie Tatarów krymskich."
  content:
    ru: "Спасибо Демчишину — не знаю, как насчёт порядочности, но, безусловно, — честному человеку. Благодаря его искренности всем стало ясно, почем нынче в Украине жизни крымских татар и других граждан, которых убивают, пытают и сажают в тюрьмы в Крыму."
    ua: "Дякую Демчишину — не знаю, як щодо порядності, але, безумовно, — чесній людині. Завдяки його щирості всім стало ясно, почому нині в Україні життя кримських татар та інших громадян, яких вбивають, катують і саджають у в'язниці в Криму."
    en: "Thanks to Demchyshyn — I don't know about decency, but certainly — an honest man. Thanks to his sincerity, everyone now understands the price of the lives of Crimean Tatars and other citizens who are killed, tortured and imprisoned in Crimea."
    pl: "Dziękuję Demczyszynowi — nie wiem jak z przyzwoitością, ale z pewnością — uczciwemu człowiekowi. Dzięki jego szczerości wszyscy teraz rozumieją, ile kosztuje życie Tatarów krymskich i innych obywateli, których zabijają, torturują i więzią na Krymie."
