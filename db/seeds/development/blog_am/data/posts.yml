# 6. Запретить крымскотатарский народ (27 октября 2015)
- slug: zapretit-krymskotatarskiy-narod
  title:
    ru: "Запретить крымскотатарский народ"
    ua: "Заборонити кримськотатарський народ"
    en: "To ban the Crimean Tatar people"
    pl: "Zakazać narodu krymskotatarskiego"
  subtitle:
    ru: "Миру, особенно Европе и США, такие подходы к национальным меньшинствам не могут понравиться."
    ua: "Світові, особливо Європі та США, такі підходи до національних меншин не можуть сподобатися."
    en: "The world, especially Europe and the USA, cannot like such approaches to national minorities."
    pl: "Świat, zwłaszcza Europa i USA, nie może lubić takiego podejścia do mniejszości narodowych."
  lead:
    ru: "Особенно мирным меньшинствам на аннексированных территориях."
    ua: "Особливо мирним меншинам на анексованих територіях."
    en: "Especially peaceful minorities in annexed territories."
    pl: "Szczególnie pokojowym mniejszościom na anektowanych terytoriach."
  content:
    ru: "Миру, особенно Европе и США, такие подходы к национальным меньшинствам, тем более мирным, тем более на аннексированных территориях, мягко говоря, не могут понравиться."
    ua: "Світові, особливо Європі та США, такі підходи до національних меншин, тим більше мирних, тим більше на анексованих територіях, м'яко кажучи, не можуть сподобатися."
    en: "The world, especially Europe and the USA, to put it mildly, cannot like such approaches to national minorities, especially peaceful ones, especially in annexed territories."
    pl: "Świat, zwłaszcza Europa i USA, delikatnie mówiąc, nie może lubić takiego podejścia do mniejszości narodowych, tym bardziej pokojowych, tym bardziej na anektowanych terytoriach."
