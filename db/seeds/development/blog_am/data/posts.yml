# 1. В новом гетто Путина (16 декабря 2016)
- slug: v-novom-getto-putina
  title:
    ru: "В новом гетто Путина вместо заборов из колючей проволоки ‒ преследования и притеснения"
    ua: "У новому гетто Путіна замість парканів з колючого дроту – переслідування і утиски"
    en: "In Putin's new ghetto, instead of barbed wire fences - persecution and oppression"
    pl: "W nowym getcie Putina zamiast ogrodzeń z drutu kolczastego – prześladowania i represje"
  subtitle:
    ru: "Я не знаю, сколько еще людей в Крыму должны быть убиты, изгнаны и лишены человеческого достоинства до момента, когда мир, когда-то победивший фашизм, встанет на защиту крымских татар."
    ua: "Я не знаю, скільки ще людей в Криму мають бути вбиті, вигнані та позбавлені людської гідності до моменту, коли світ, який колись переміг фашизм, стане на захист кримських татар."
    en: "I don't know how many more people in Crimea must be killed, expelled and stripped of human dignity before the world that once defeated fascism will stand up for the Crimean Tatars."
    pl: "Nie wiem, ile jeszcze ludzi na Krymie musi zostać zabitych, wypędzonych i pozbawionych ludzkiej godności, zanim świat, który kiedyś pokonał faszyzm, stanie w obronie Tatarów krymskich."
  lead:
    ru: "В то время, когда мой народ подвергается гонениям со стороны России, – мир молчит."
    ua: "У той час, коли мій народ зазнає гонінь з боку Росії – світ мовчить."
    en: "While my people are being persecuted by Russia, the world is silent."
    pl: "Podczas gdy mój naród jest prześladowany przez Rosję – świat milczy."
  content:
    ru: "В то время, когда мой народ подвергается гонениям со стороны России, – мир молчит.\n\nКрымский полуостров, захваченный Россией в 2014 году, стремительно превратился в поле для широких репрессий."
    ua: "У той час, коли мій народ зазнає гонінь з боку Росії – світ мовчить.\n\nКримський півострів, захоплений Росією у 2014 році, стрімко перетворився на поле для широких репресій."
    en: "While my people are being persecuted by Russia, the world is silent.\n\nThe Crimean peninsula, seized by Russia in 2014, has rapidly become a field for widespread repression."
    pl: "Podczas gdy mój naród jest prześladowany przez Rosję – świat milczy.\n\nPółwysep Krymski, zajęty przez Rosję w 2014 roku, szybko stał się polem szeroko zakrojonych represji."
  featured: false
  status: published
  published_at: 2016-12-16 15:37:00
  category_slug: politics
  tag_slugs:
    - krym
  source_name: "Українська правда"
  source_url: "https://www.pravda.com.ua/rus/columns/2016/12/16/7130070/"

# 2. Что может сделать Украина для крымских татар (18 мая 2016)
- slug: chto-mozhet-sdelat-ukraina-dlya-krymskih-tatar
  title:
    ru: "Что может сделать Украина для крымских татар и возвращения Крыма"
    ua: "Що може зробити Україна для кримських татар і повернення Криму"
    en: "What Ukraine can do for the Crimean Tatars and the return of Crimea"
    pl: "Co Ukraina może zrobić dla Tatarów krymskich i odzyskania Krymu"
  subtitle:
    ru: "Необходимо немедленно начать конституционный процесс реализации прав крымскотатарского народа как коренного народа Украины."
    ua: "Необхідно негайно розпочати конституційний процес реалізації прав кримськотатарського народу як корінного народу України."
    en: "It is necessary to immediately begin the constitutional process of implementing the rights of the Crimean Tatar people as an indigenous people of Ukraine."
    pl: "Konieczne jest natychmiastowe rozpoczęcie konstytucyjnego procesu realizacji praw narodu krymskotatarskiego jako rdzennego narodu Ukrainy."
  lead:
    ru: "На практике это означает создание в Крыму крымскотатарской национально-территориальной автономии в составе единой Украины."
    ua: "На практиці це означає створення в Криму кримськотатарської національно-територіальної автономії у складі єдиної України."
    en: "In practice, this means creating a Crimean Tatar national-territorial autonomy in Crimea as part of a united Ukraine."
    pl: "W praktyce oznacza to utworzenie na Krymie krymskotatarskiej autonomii narodowo-terytorialnej w ramach zjednoczonej Ukrainy."
  content:
    ru: "Необходимо немедленно начать конституционный процесс реализации прав крымскотатарского народа как коренного народа Украины."
    ua: "Необхідно негайно розпочати конституційний процес реалізації прав кримськотатарського народу як корінного народу України."
    en: "It is necessary to immediately begin the constitutional process of implementing the rights of the Crimean Tatar people as an indigenous people of Ukraine."
    pl: "Konieczne jest natychmiastowe rozpoczęcie konstytucyjnego procesu realizacji praw narodu krymskotatarskiego jako rdzennego narodu Ukrainy."
