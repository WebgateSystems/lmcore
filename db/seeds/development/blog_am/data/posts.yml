# 3. Крымские татары "второго сорта" (3 марта 2016)
- slug: krymskie-tatary-vtorogo-sorta
  title:
    ru: "Крымские татары \"второго сорта\""
    ua: "Кримські татари \"другого сорту\""
    en: "Crimean Tatars of \"second class\""
    pl: "Tatarzy krymscy \"drugiej kategorii\""
  subtitle:
    ru: "Напомню, что крымские татары точно так же находятся в руках российской репрессивной машины."
    ua: "Нагадаю, що кримські татари так само перебувають у руках російської репресивної машини."
    en: "Let me remind you that the Crimean Tatars are also in the hands of the Russian repressive machine."
    pl: "Przypomnę, że Tatarzy krymscy również znajdują się w rękach rosyjskiej machiny represji."
  lead:
    ru: "Им точно так же грозят тяжкие статьи УК РФ ни за что. Точнее, за преданность Родине, Украине."
    ua: "Їм так само загрожують тяжкі статті КК РФ ні за що. Точніше, за відданість Батьківщині, Україні."
    en: "They also face serious articles of the Criminal Code of the Russian Federation for nothing. More precisely, for loyalty to the Motherland, Ukraine."
    pl: "Im również grożą ciężkie artykuły kodeksu karnego FR za nic. A właściwie za wierność Ojczyźnie, Ukrainie."
  content:
    ru: "Напомню, что крымские татары точно так же находятся в руках российской репрессивной машины. Им точно так же грозят тяжкие статьи УК РФ ни за что."
    ua: "Нагадаю, що кримські татари так само перебувають у руках російської репресивної машини. Їм так само загрожують тяжкі статті КК РФ ні за що."
    en: "Let me remind you that the Crimean Tatars are also in the hands of the Russian repressive machine. They also face serious articles of the Criminal Code."
    pl: "Przypomnę, że Tatarzy krymscy również znajdują się w rękach rosyjskiej machiny represji. Im również grożą ciężkie artykuły kodeksu karnego FR za nic."
