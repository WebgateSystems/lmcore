#     class: SyncYoutubeChannelVideosWorker
#     args:
#       - '<ayder-user-id>'
#       - 'https://www.youtube.com/@AyderMuzhdabaev/videos'
#       - 'uk'
#       - 'media'

development:
  :concurrency: 5

test:
  :concurrency: 1

staging:
  :concurrency: <%= ENV.fetch('SIDEKIQ_CONCURRENCY', 15) %>

production:
  :concurrency: <%= ENV.fetch('SIDEKIQ_CONCURRENCY', 20) %>
